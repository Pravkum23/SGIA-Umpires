name: Close past matches and verify current schedule
on:
  push:
    branches: [main]
    paths: ['.github/workflows/schedule-closeout-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'SQLAlchemy>=2.0,<3' 'psycopg2-binary>=2.9,<3'
      - name: Close past matches and check saved SHL5 fixtures
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          from datetime import timedelta
          from src.db import get_engine, rows
          from src.weekly import close_past_matches, singapore_now, week_bounds

          db = get_engine()
          try:
              now = singapore_now()
              monday, _ = week_bounds(now.date())
              closed = close_past_matches(db, now)
              matches = rows(db, """
                  SELECT f.poll_state, COUNT(DISTINCT CASE WHEN a.confirmed=true AND a.status='ASSIGNED'
                      AND a.role IN ('umpire_1','umpire_2','scorer') THEN a.role END) AS saved_roles
                  FROM fixtures f LEFT JOIN assignments a ON a.fixture_id=f.id
                  WHERE f.tournament='SHL5' AND f.match_status='SCHEDULED'
                    AND f.starts_at>=:start AND f.starts_at<:end
                  GROUP BY f.id,f.poll_state
              """, {"start": monday + timedelta(days=1), "end": monday + timedelta(days=5)})
              print(f"Past matches completed: {closed}")
              print(f"Current weekday fixtures: {len(matches)}")
              print(f"Complete saved weekday allocations: {sum(m['saved_roles']==3 for m in matches)}")
              print(f"Published weekday allocations: {sum(m['poll_state']=='PUBLISHED' and m['saved_roles']==3 for m in matches)}")
          except Exception:
              raise SystemExit("Could not verify the schedule. Database details withheld.") from None
          finally:
              db.dispose()
          PY
