name: Open SHL5 availability
on:
  schedule:
    # Friday 9 PM and Monday 6 PM in Singapore (UTC+8).
    - cron: '0 13 * * 5'
    - cron: '0 10 * * 1'
    # Daily catch-up for delayed runs or newly imported fixtures.
    - cron: '17 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shl5-availability
  cancel-in-progress: false
jobs:
  open-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'SQLAlchemy>=2.0,<3' 'psycopg2-binary>=2.9,<3'
      - run: python -m src.availability_schedule
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
