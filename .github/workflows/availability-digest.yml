name: WhatsApp availability summary
on:
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 13 * * 4'
  workflow_dispatch:
    inputs:
      period:
        description: Matches to summarise
        type: choice
        options: [weekdays, weekend]
        default: weekdays
permissions:
  contents: read
concurrency:
  group: whatsapp-availability-summary
  cancel-in-progress: false
jobs:
  send:
    if: vars.SGIA_WHATSAPP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'SQLAlchemy>=2.0,<3' 'psycopg2-binary>=2.9,<3'
      - run: python -m src.availability_digest
        env:
          DIGEST_PERIOD: ${{ github.event.inputs.period || (github.event.schedule == '0 13 * * 4' && 'weekend' || 'weekdays') }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHATSAPP_PROVIDER: ${{ vars.WHATSAPP_PROVIDER || 'meta' }}
          WAHA_URL: ${{ secrets.WAHA_URL }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          WAHA_SESSION: ${{ vars.WAHA_SESSION || 'default' }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE: ${{ vars.WHATSAPP_TEMPLATE }}
          WHATSAPP_LANGUAGE: ${{ vars.WHATSAPP_LANGUAGE || 'en_US' }}
