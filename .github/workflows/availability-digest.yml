name: Email availability summary
on:
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 13 * * 4'
  workflow_dispatch:
    inputs:
      period:
        description: Matches to summarise
        type: choice
        options: [weekdays, weekend]
        default: weekdays
permissions:
  contents: read
concurrency:
  group: availability-summary
  cancel-in-progress: false
jobs:
  send:
    if: vars.SGIA_EMAIL_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check email setup
        id: setup
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -n "$SMTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Email delivery is not active. Add the SMTP_PASSWORD repository secret."
          fi
      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install 'SQLAlchemy>=2.0,<3' 'psycopg2-binary>=2.9,<3'
        if: steps.setup.outputs.ready == 'true'
      - run: python -m src.availability_digest
        if: steps.setup.outputs.ready == 'true'
        env:
          DIGEST_CHANNEL: email
          DIGEST_PERIOD: ${{ github.event.inputs.period || (github.event.schedule == '0 13 * * 4' && 'weekend' || 'weekdays') }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_TO: kumprav001@gmail.com
          SMTP_USER: ${{ vars.SMTP_USER || 'kumprav001@gmail.com' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
